name: Open benchmark scripts

# Runs the scripts that live in this repository (public data only), checks that the result files still match
# the OpenTimestamps-stamped manifests, that every number in README.md comes from its result file, and runs the
# test suite on three operating systems and four Python versions.
on: [push, pull_request]

# Токен Actions — только чтение (17.10.2026, аудит цепочки поставки).
permissions:
  contents: read

# 18.10.2026: одно ядро OpenBLAS на всех серверах. Коды Sign-LSH — знак float32-проекций, а порядок сложения
# зависит от ядра: на сервере с AVX-512 Recall@10 выходил 80,7 вместо заверенных 80,5. Haswell (AVX2) — ядро машины замера.
env:
  OPENBLAS_CORETYPE: Haswell

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Stamped results match the manifest of 23 September 2026
        # README.md is excluded: the manifest stamps the README of the full repository (23.09),
        # this repository has its own README.
        # 05.10.2026 сменились LICENSE и строка лицензии в заголовке двух скриптов (Apache 2.0 ->
        # PolyForm Noncommercial 1.0.0); их версии 23.09 остаются в истории git до коммита 067f3af.
        # Код не менялся — следующий шаг сверяет каждый файл на 5 октября.
        run: grep -v -E ' (README.md|LICENSE|bench/olfactory_filter_run.py|bench/proof_of_connectome.py)$' results/MANIFEST_2026-09-23.sha256 | sha256sum -c --ignore-missing
      - name: Stamped files match the manifest of 5 October 2026
        # 12.10.2026 в README.md дописаны разделы 8–9 и исправлено NDCG 0.872 -> 0.871; README 5 октября — коммит 18b7e64.
        run: grep -v -E ' README.md$' results/MANIFEST_2026-10-05.sha256 | sha256sum -c
      - name: Every tracked file matches the manifest of 12 October 2026
        # 18.10.2026 законно изменены README.md (бейдж DOI Zenodo), CITATION.cff (версия 2026.10.18 для архивного релиза)
        # и tests/test_results_integrity.py (список изменённых); их версии 12 октября — коммит 926629d.
        # bench/reproduce.py — 18.10.2026 закрепление ядра OpenBLAS для запусков у людей.
        run: grep -v -E ' (README\.md|CITATION\.cff|tests/test_results_integrity\.py|bench/reproduce\.py)$' results/MANIFEST_2026-10-12.sha256 | sha256sum -c
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Every number in README.md equals the value in its result file
        run: python bench/check_claims.py
      - name: Merkle-tree proof (synthetic neurons)
        run: python bench/proof_of_connectome.py --n-neurons 5000
      - name: Aho-Corasick string filter
        run: python bench/olfactory_filter_run.py
      - name: Merkle tree with RFC 6962 inclusion proofs (synthetic neurons)
        run: python bench/merkle_rfc6962.py
      - name: Open retrieval arena (exact, Sign-LSH, multi-table LSH)
        run: python bench/open_arena.py
      - name: Re-run everything and compare with the stamped files
        run: python bench/reproduce.py --skip-connectome

  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Test suite
        run: python -m pytest -q
