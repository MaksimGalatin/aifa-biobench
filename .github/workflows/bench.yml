name: Open benchmark scripts

# Runs the scripts that live in this repository (public data only) and checks that
# the result files still match the OpenTimestamps-stamped manifest.
on: [push, pull_request]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stamped results match the manifest of 23 September 2026
        # README.md is excluded: the manifest stamps the README of the full repository (23.09),
        # this repository has its own README.
        # 05.10.2026 сменились LICENSE и строка лицензии в заголовке двух скриптов (Apache 2.0 ->
        # PolyForm Noncommercial 1.0.0); их версии 23.09 остаются в истории git до коммита 067f3af.
        # Код не менялся — следующий шаг сверяет каждый файл на 5 октября.
        run: grep -v -E ' (README.md|LICENSE|bench/olfactory_filter_run.py|bench/proof_of_connectome.py)$' results/MANIFEST_2026-09-23.sha256 | sha256sum -c --ignore-missing
      - name: Stamped files match the manifest of 5 October 2026
        # Все файлы этого репозитория из манифеста 23.09 в состоянии на 5 октября 2026 (метка OpenTimestamps — .ots рядом).
        run: sha256sum -c results/MANIFEST_2026-10-05.sha256
      - name: Install dependencies
        run: pip install numpy scipy
      - name: Merkle-tree proof (synthetic neurons)
        run: python bench/proof_of_connectome.py --n-neurons 5000
      - name: Aho-Corasick string filter
        run: python bench/olfactory_filter_run.py
